<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán MoMo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #A50064;
            --secondary-color: #D82D8B;
            --text-color: #333;
            --light-text-color: #666;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #A50064 0%, #D82D8B 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .checkout-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .momo-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #A50064, #D82D8B);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(165, 0, 100, 0.3);
        }

        .momo-logo i {
            font-size: 2.5em;
            color: white;
        }

        header h1 {
            font-size: 1.8em;
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        .section-title {
            font-size: 1.3em;
            color: var(--text-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            font-weight: 600;
        }

        .section-title i {
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .order-summary {
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #fef5fb 0%, #fff 100%);
            border-radius: 12px;
            border: 2px solid #f0d0e5;
        }

        .order-summary .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dotted #e0e0e0;
        }

        .order-summary .item:last-child {
            border-bottom: none;
        }

        .order-summary .item-label {
            font-weight: 500;
            color: var(--light-text-color);
            font-size: 0.95em;
        }

        .order-summary .item-value {
            font-weight: 600;
            color: var(--text-color);
        }

        .order-summary .total-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid var(--primary-color);
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary-color);
        }

        .payment-info {
            background-color: #fff5fc;
            border-left: 4px solid var(--primary-color);
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .payment-info p {
            margin: 8px 0;
            font-size: 0.95em;
            color: var(--light-text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .payment-info i {
            color: var(--primary-color);
        }

        .pay-button,
        .btn.btn-danger {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #A50064 0%, #D82D8B 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(165, 0, 100, 0.4);
        }

        .pay-button:hover:not(:disabled),
        .btn.btn-danger:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(165, 0, 100, 0.5);
        }

        .pay-button:disabled,
        .btn.btn-danger:disabled {
            background: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .pay-button i,
        .btn.btn-danger i {
            font-size: 1.2em;
        }

        .security-badge {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .security-badge p {
            color: var(--light-text-color);
            font-size: 0.85em;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-badge i {
            color: #4CAF50;
        }

        @media (max-width: 600px) {
            .checkout-container {
                padding: 25px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .order-summary .total-amount {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <header>
            <div class="momo-logo">
                <i class="fas fa-wallet"></i>
            </div>
            <h1>Thanh Toán MoMo</h1>
        </header>
        
        <main>
            <section class="order-summary">
                <h2 class="section-title">
                    <i class="fas fa-receipt"></i>
                    Thông Tin Đơn Hàng
                </h2>
                <div class="item">
                    <span class="item-label">Mã đơn hàng:</span>
                    <span class="item-value" id="summary-order-id">#HD12345</span>
                </div>
                <div class="item">
                    <span class="item-label">Mô tả:</span>
                    <span class="item-value" id="summary-description">Thanh toán dịch vụ</span>
                </div>
                <div class="item">
                    <span class="item-label">Người thanh toán:</span>
                    <span class="item-value" id="summary-name">NGUYEN VAN A</span>
                </div>
                <div class="total-amount">
                    <span>Tổng cộng:</span>
                    <span id="summary-amount">50.000 VNĐ</span>
                </div>
            </section>

            <div class="payment-info">
                <p><i class="fas fa-check-circle"></i> Thanh toán nhanh chóng và bảo mật</p>
                <p><i class="fas fa-check-circle"></i> Hỗ trợ 24/7</p>
                <p><i class="fas fa-check-circle"></i> Hoàn tiền tự động nếu có lỗi</p>
            </div>

            <form method="POST" asp-action="CreatePaymentMomo" asp-controller="Payment">
                <input type="hidden" name="Amount" value="@Model.GrandTotal"/>
                <input type="hidden" name="OrderId" value="@Guild.NewGuild().ToString()"/>
                <input type="hidden" name="OrderInfo" value="Thanh toán tại đây"/>
                <input type="hidden" name="fullname" value=""/>
                <button class="btn btn-danger" name="PayUrl" type="submit">Pay with MoMo</button>
            </form>

            <div class="security-badge">
                <p><i class="fas fa-shield-alt"></i> Giao dịch được bảo mật bởi MoMo</p>
                <p><i class="fas fa-lock"></i> Thông tin của bạn được mã hóa</p>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            
            document.getElementById('summary-order-id').textContent = '#HD' + Date.now().toString().slice(-8);
            document.getElementById('summary-description').textContent = form.querySelector('input[name="OrderDescription"]').value;
            document.getElementById('summary-name').textContent = form.querySelector('input[name="Name"]').value;
            
            const amount = parseFloat(form.querySelector('input[name="Amount"]').value);
            document.getElementById('summary-amount').textContent = amount.toLocaleString('vi-VN') + ' VNĐ';

            // Generate OrderId before submit
            const orderId = 'MOMO' + Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            document.getElementById('hidden-order-id').value = orderId;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Thanh Toán Đơn Hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4CAF50; /* Màu xanh lá tươi */
            --secondary-color: #2196F3; /* Màu xanh dương */
            --text-color: #333;
            --light-text-color: #666;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Giữ top alignment */
            min-height: 100vh;
            box-sizing: border-box;
        }

        .checkout-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            padding: 30px 40px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2.2em;
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        .section-title {
            font-size: 1.5em;
            color: var(--text-color);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            font-weight: 600;
        }

        .section-title i {
            color: var(--secondary-color);
            font-size: 1.2em;
        }

        /* Order Summary Section */
        .order-summary {
            margin-bottom: 30px;
            padding: 15px 20px;
            background-color: #f4f7f6; /* Nền nhẹ nhàng hơn */
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .order-summary .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dotted #d0d0d0;
        }

        .order-summary .item:last-child {
            border-bottom: none;
        }

        .order-summary .item-label {
            font-weight: 500;
            color: var(--light-text-color);
        }

        .order-summary .item-value {
            font-weight: 600;
            color: var(--text-color);
        }

        .order-summary .total-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Payment Method Section */
        .payment-option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--card-bg);
        }

        .payment-option:hover {
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.2);
        }

        .payment-option.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.3);
            background-color: #e8f5e9; /* Nền xanh lá nhạt cho lựa chọn */
        }

        .payment-option input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.4);
            accent-color: var(--primary-color); /* Màu của radio button */
        }

        .payment-option label {
            flex-grow: 1;
            font-size: 1.1em;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
        }

        .pay-button {
            width: 100%;
            padding: 15px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .pay-button:hover:not(:disabled) {
            background-color: #43a047; /* Màu xanh đậm hơn khi hover */
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        .pay-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .pay-button i {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <header>
            <h1>Xác Nhận Thanh Toán</h1>
        </header>
        <main>
            <section class="order-summary">
                <h2 class="section-title"><i class="fas fa-receipt"></i>Tóm Tắt Đơn Hàng</h2>
                <div class="item">
                    <span class="item-label">Mã đơn hàng:</span>
                    <span class="item-value" id="summary-order-id">#HD12345</span>
                </div>
                <div class="item">
                    <span class="item-label">Mô tả:</span>
                    <span class="item-value" id="summary-description">Thanh toán dịch vụ tháng 07/2024</span>
                </div>
                <div class="item">
                    <span class="item-label">Người thanh toán:</span>
                    <span class="item-value" id="summary-name">NGUYEN VAN A</span>
                </div>
                <div class="total-amount">
                    <span>Tổng cộng:</span>
                    <span id="summary-amount">50.000 VNĐ</span>
                </div>
            </section>

            <section class="payment-method">
                <h2 class="section-title"><i class="fas fa-credit-card"></i>Phương Thức Thanh Toán</h2>
                
                <form id="payment-form"> 
                    <div class="payment-option selected" data-method="VNPAY">
                        <input type="radio" id="vnpay" name="payment_method" value="VNPAY" checked>
                        <label for="vnpay">Cổng thanh toán VNPAY</label>
                        </div>
                    <input type="hidden" name="Amount" id="input-amount" value="50000" />
                    <input type="hidden" name="OrderDescription" id="input-order-description" value="Thanh toan don hang #12345" />
                    <input type="hidden" name="Name" id="input-name" value="NGUYEN VAN A" />
                    <input type="hidden" name="OrderType" id="input-order-type" value="other" />
                    <input type="hidden" name="OrderId" id="hidden-order-id" /> 

                    <button type="button" class="pay-button" id="pay-button">
                        <i class="fas fa-lock"></i> Thanh Toán An Toàn
                    </button>
                </form>
            </section>
        </main>
    </div>

    <script>
        // Cập nhật thông tin tóm tắt đơn hàng khi trang tải
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('payment-form');
            document.getElementById('summary-order-id').textContent = '#HD' + Date.now().toString().slice(-8); // Generate temp ID for display
            document.getElementById('summary-description').textContent = form.querySelector('input[name="OrderDescription"]').value;
            document.getElementById('summary-name').textContent = form.querySelector('input[name="Name"]').value;
            const amount = parseFloat(form.querySelector('input[name="Amount"]').value);
            document.getElementById('summary-amount').textContent = amount.toLocaleString('vi-VN') + ' VNĐ';

            // Logic chọn phương thức thanh toán
            document.querySelectorAll('.payment-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    this.querySelector('input[type="radio"]').checked = true;
                });
            });
        });

        document.getElementById('pay-button').addEventListener('click', async function() {
            const payButton = this;
            const form = document.getElementById('payment-form');
            
            payButton.disabled = true;
            payButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

            // TẠO MÃ ĐƠN HÀNG NGẪU NHIÊN MỖI LẦN CLICK
            // Sẽ là một chuỗi duy nhất, ví dụ: HD + timestamp
            const orderId = 'HD' + Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            document.getElementById('hidden-order-id').value = orderId;
            document.getElementById('summary-order-id').textContent = `#${orderId}`; // Cập nhật trên UI

            const paymentData = {
                OrderId: document.getElementById('hidden-order-id').value,
                Amount: parseFloat(document.getElementById('input-amount').value),
                OrderDescription: document.getElementById('input-order-description').value,
                Name: document.getElementById('input-name').value,
                OrderType: document.getElementById('input-order-type').value
            };

            try {
                const response = await fetch('/api/Payment/create-vnpay-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData)
                });

                if (response.ok) {
                    const result = await response.json();
                    window.location.href = result.paymentUrl;
                } else {
                    const errorData = await response.json();
                    alert('Đã có lỗi xảy ra: ' + (errorData.message || 'Không xác định'));
                    payButton.disabled = false;
                    payButton.innerHTML = '<i class="fas fa-lock"></i> Thanh Toán An Toàn';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Lỗi kết nối đến server. Vui lòng thử lại.');
                payButton.disabled = false;
                payButton.innerHTML = '<i class="fas fa-lock"></i> Thanh Toán An Toàn';
            }
        });
    </script>
</body>
</html>
